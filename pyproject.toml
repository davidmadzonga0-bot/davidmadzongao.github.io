[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "my-personal-agents"
version = "0.1.0"
description = "Telegram-led personal multi-agent system with email, research, and business workers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0.0",
  "python-dotenv>=1.0.0",
  "python-telegram-bot>=21.0",
]

[project.scripts]
personal-agents = "personal_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
